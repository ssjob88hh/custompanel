<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Panel Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .panel {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 5px;
            width: 300px;
            margin: 40px auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .panel h2 { margin-top: 0; }
        .panel label { display: block; margin-bottom: 8px; }
        .panel input[type="color"] { width: 100%; height: 30px; border: none; }
    </style>
</head>
<body>
    <div class="panel" id="panel">
        <h2>Custom Panel</h2>
        <label for="bgColor">Background Color:</label>
        <input type="color" id="bgColor" value="#f0f0f0">
    </div>
    <script>
        const bgColorInput = document.getElementById('bgColor');
        const panel = document.getElementById('panel');
        bgColorInput.addEventListener('input', () => {
            panel.style.backgroundColor = bgColorInput.value;
        });
    </script>
</body>
</html>
